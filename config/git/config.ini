# =============================================
# Git Global Configuration File
#
# This is an optimized Git configuration file.
# =============================================

[user]
    # Enforce explicit configuration to prevent committing as system user
    useConfigOnly = true

    # Default identity — left EMPTY on purpose: git refuses to commit with a
    # clear error until you fill these in (see README "Git Identity Setup").
    # Enter your GPG key fingerprint last (gpg --full-generate-key).
    name =
    email =
    signingkey =

[init]
    # Use 'main' as the default branch name for new repositories
    defaultBranch = main

[credential]
    # CREDENTIAL STORAGE — deliberate, and deliberately NOT a file.
    #
    # Git asks the GitHub CLI for HTTPS credentials instead of keeping any
    # itself. `gh auth git-credential` reads the token the CLI already holds
    # (in the system keyring), so no secret is written anywhere by git.
    #
    # The alternative is `helper = store`, which writes the token in PLAINTEXT
    # to ~/.git-credentials. That file is exactly the kind of thing a dotfiles
    # repository ends up publishing by accident, and `config status` warns if
    # this line is ever replaced by it.
    #
    # `!` means "run this command" and is not a path on purpose: an absolute
    # path to gh would break on every machine that installs it elsewhere.
    #
    # Requires an authenticated GitHub CLI (`gh auth login`). Unauthenticated,
    # git reports gh's own error instead of silently falling back to a prompt.
    helper = !gh auth git-credential

[core]
    # CACHE & PERFORMANCE
    # Use the cache for file status to speed up large monorepos
    fsmonitor = true
    # Speed up index updates for untracked files
    untrackedCache = true

    # LINE ENDINGS & ENCODING
    # Force LF on commit
    autocrlf = input
    # Display CJK characters correctly in status/log output (do not escape)
    quotePath = false
    # Fix macOS unicode normalization issues (NFD vs NFC)
    precomposeunicode = true

    # EDITOR
    # A commit message is a document that people read in `git log`, so the
    # editor entry point formats it before the editor ever opens. This is what
    # covers the paths that prepare-commit-msg never sees -- `git commit
    # --amend` and `git rebase -i` -- because a formatting rule that only
    # applies when someone remembers to invoke a tool is not a rule.
    #
    # The editor is not hardcoded: wrap-msg.sh formats the file in place and
    # then execs $VISUAL, falling back to $EDITOR and then vim.
    #
    # Path resolution: DSH_DOTFILES_DIR is exported by config/bash/rc.d
    # (00-xdg.sh); the fallback is the documented clone location.
    #
    # This value must be a SINGLE LINE with NO command separator, and it must
    # not nest another "sh -c". Git runs the value through a shell itself, so a
    # nested "sh -c" loses the message-file argument and the formatter is called
    # with no file. Git's config format also has no multi-line value (a quoted
    # newline is a parse error and a backslash continuation does not preserve
    # the newline), and an unescaped ";" starts a line comment that truncates
    # the value. Each of those was a real failure before this form was found.
    #
    # The command is therefore one statement: git's shell execs
    # config/git/wrap-msg.sh, which formats the message in place and then execs the
    # real editor. The inner quotes are escaped so the config parser does not
    # strip them.
    editor = "${DSH_DOTFILES_DIR:-$HOME/dotfiles}/config/git/wrap-msg.sh" --edit "$1"

    # Global hooks directory (XDG-compliant, symlinked by install.sh).
    # NOTE: Overrides .git/hooks. Dispatched via *.local files for 
    # prepare-commit-msg (AI draft), pre-commit, commit-msg, pre-push, and post-commit.
    hooksPath = ~/.config/git/hooks

[commit]
    # GPG sign commits by default ensures provenance
    gpgSign = true

    # Help formulate structured commit messages. Reminds you what files are actually changing.
    verbose = true

[tag]
    # GPG sign tags by default ensures provenance
    gpgSign = true

[column]
    # Display branches and lists in columns (like 'ls')
    ui = auto

[branch]
    # Sort branches by most recent commit date first. Saves time finding active context.
    sort = -committerdate

[diff]
    # LOGIC AWARENESS
    # Use Histogram algorithm. It is far superior to Myers for code logic.
    algorithm = histogram
    # Detect moved lines effectively to reduce diff noise
    colorMoved = default
    colorMovedWS = allow-indentation-change
    # Detect copies as well as renames for better history tracking
    renames = copies

    # Better diff header context
    tool = vimdiff

[merge]
    # Show common ancestor in conflicts (3-way diff)
    # CRITICAL for understanding the "why" behind a conflict
    conflictstyle = zdiff3

[pull]
    # LINEAR HISTORY ENFORCEMENT
    # Always rebase on pull. Never create merge bubbles for simple updates.
    rebase = true

[fetch]
    # CLEANUP & SPEED
    # Clean up stale remote-tracking branches
    prune = true
    pruneTags = true
    # Let Git choose a reasonable default for parallel fetching
    parallel = 0

[push]
    # SAFETY & CONVENIENCE
    # Stricter safety. Only push if the upstream tracking branch matches.
    default = simple
    # Automatically setup remote tracking branch on first push (Git 2.37+)
    autoSetupRemote = true
    # Push tags automatically if they are related to the commits being pushed
    followTags = true

[rebase]
    # WORKFLOW OPTIMIZATION
    # Automatically stash dirty index before rebase and pop after
    autostash = true
    # Automatically handle fixup and squash commits during interactive rebase. Essential for atomic commit workflows.
    autosquash = true

[rerere]
    # REUSE RECORDED RESOLUTION
    # Automatically resolves conflicts you have resolved before.
    enabled = true

[help]
    # Never auto-execute typos. Always prompt for explicit confirmation
    # before running the corrected command (e.g., 'git sttaus' -> 'git status').
    autocorrect = prompt

[alias]
    # --- Efficiency Shortcuts ---

    # Status: Short format with branch info
    s = status -sb

    # Switch & Restore (Deprecated checkout)
    sw = switch
    rs = restore

    # bclean: Deletes branches merged into <ref> (default: HEAD).
    # - Safe delete (-d) only; skips protected (main/master/develop/staging/trunk),
    #   current HEAD, and other worktrees.
    # - NOTE: Squash-merges not detected (use `gh pr merge --delete-branch` instead).
    bclean = "!f() { TARGET_REF=\"${1:-HEAD}\"; git branch --format='%(HEAD)|%(worktreepath)|%(refname:short)' | while IFS='|' read -r head wt branch; do [ \"$head\" = '*' ] || [ -n \"$wt\" ] && continue; [ \"$branch\" = \"$TARGET_REF\" ] && continue; echo \"$branch\" | grep -qE '^(main|master|develop|staging|trunk)$' && continue; git merge-base --is-ancestor \"$branch\" \"$TARGET_REF\" 2>/dev/null && git branch -d \"$branch\"; done; }; f"

    # --- Log Visualization ---

    # Minimal graph
    lg = log --oneline --graph --pretty=format:'%C(red)%h%Creset %C(bold cyan)<%an>%Creset -%C(bold magenta)%d%Creset %s %C(yellow)(%ar)%Creset'

    # Full history visualization with Commit Date
    lga = log --graph --abbrev-commit --decorate --all --date=format:'%Y-%m-%d %H:%M' --pretty=format:'%C(red)%h%Creset %C(green)%ad%Creset %C(yellow)(%ar)%Creset%C(bold magenta)%d%Creset %C(bold cyan)<%an>%Creset%n          %s'

    # --- Diff & Staging ---

    # Add interactively (Patch mode)
    ap = add -p

    # Commit with verbose output (shows diff in editor)
    ci = commit -v

    # Diff currently staged files
    ds = diff --staged

    # Diff excluding whitespace changes
    dw = diff -w

    # Diff through Hunk's pager when hunk is on PATH (part of the optional
    # Git TUI toolchain installed via './install.sh --with-git-tui'); falls
    # back to a plain diff when hunk is missing (no hard error).
    hdiff = "!f() { if command -v hunk >/dev/null 2>&1; then git -c core.pager='hunk pager' diff \"$@\"; else git diff \"$@\"; fi; }; f"

    # --- Rebase & Sync ---

    # Rebase interactive on last N commits
    ri = rebase -i

    # Continue rebase after conflict resolution
    rc = rebase --continue

    # Abort rebase
    ra = rebase --abort

    # Update: Pull with rebase
    up = pull --rebase

    # Safe force push: double-lease verification.
    # --force-with-lease checks the remote-tracking ref; --force-if-includes
    # additionally checks the local reflog to ensure the remote tip is already
    # integrated locally. Prevents overwriting others' work even after a
    # background fetch. Requires Git >= 2.30.
    pf = push --force-with-lease --force-if-includes

    # --- Maintenance ---

    # Verify object database integrity (Check for corruption)
    verify = fsck --full --strict

# --- Conditional Includes ---
# This is a modern way to manage multiple work/personal identities.
#
# Usage:
# 1. Create a `work.ini` file next to this one (i.e.
#    $XDG_CONFIG_HOME/git/work.ini) and FILL IN your company identity
#    (ships empty on purpose — see README "Git Identity Setup"):
#    [user]
#        name = Your Company Name
#        email = you@company.com
#        signingkey = <GPG fingerprint>
#
# 2. In the following settings, change `~/workspace/` to the directory path where you store your company projects.
#    Git will automatically load and overwrite the corresponding user settings when entering the directory.
#
# NOTE: the include path below is RELATIVE on purpose — git resolves relative
# include paths against the directory of the config file containing the
# directive, so work.ini is found wherever THIS config.ini lives (default
# ~/.config/git or any custom XDG_CONFIG_HOME).

[includeIf "gitdir:~/workspace/"]
    path = work.ini
