# =============================================
# Lazygit config for the AI HITL review flow (optional: install --with-git-tui).
# =============================================

gui:
  showIcons: true
  theme:
    activeBorderColor:
      - '#50fa7b'
      - bold
    inactiveBorderColor:
      - '#6272a4'

# NOTE: git.paging.pager is deliberately unset; the Hunk TUI is launched as a
# subprocess from the 'H' command below, which is more reliable than piping diffs
# into an interactive pager.

customCommands:
  - key: 'H'
    context: 'files'
    command: 'hunk diff'
    description: 'Launch Hunk TUI review of the working tree'
    subprocess: true

  # 'A' commits with the AI draft injected by the prepare-commit-msg hook. Context is
  # 'files', not 'global': lazygit's built-in 'A' is Amend in the commit panels, and in
  # the Files panel 'A' is unbound, so nothing collides.
  - key: 'A'
    context: 'files'
    command: 'git commit'
    description: 'Commit with AI draft injected by the prepare-commit-msg hook'
    subprocess: true

  # Safe force push. Not bound to 'P': lazygit's default keymap is P = Push, p = Pull
  # (>= 0.44), so overriding it would silently replace the normal push. 'F' is unbound.
  - key: 'F'
    context: 'global'
    command: 'git pf'
    description: 'Safe force push (--force-with-lease --force-if-includes)'
    subprocess: true
